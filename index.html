// ---------------------------------------------------------------------------
// Picture formats: where the picture sits on the canvas (uv, y up) and what surrounds it.
// edge: 0 nothing, 1 instant card, 2 film gate, 3 slide mount, 4 sprocket holes, 5 widescreen bars.
// ---------------------------------------------------------------------------
const CARDS = { instant: [88, 107, 4.5, 22, 79, 79], mini: [54, 86, 4, 17, 46, 62], square: [72, 86, 5, 17, 62, 62] }; // card w, h, then picture x, y from the bottom, w, h, in mm
const PAPER = { instant: [.94, .93, .9], mini: [.96, .96, .95], square: [.95, .94, .91] };
const CARD_COLOURS = [[.95, .94, .91], [.11, .11, .12], [.62, .76, .87], [.94, .72, .75], [.7, .86, .77]];
const RATIOS = { '1:1': 1, '3:4': 3 / 4, '2:3': 2 / 3, '9:16': 9 / 16 };

function formatOf(f, landscape) {
  const card = CARDS[f.frame];
  if (card) {
    const [W, H, x, y, w, h] = card;
    return { aspect: W / H, win: [x / W, y / H, w / W, h / H], edge: 1, round: 0 };
  }
  if (f.frame === 'mount') return { aspect: 1, win: landscape ? [7 / 50, 13 / 50, 36 / 50, 24 / 50] : [13 / 50, 7 / 50, 24 / 50, 36 / 50], edge: 3, round: .04 };
  if (f.frame === 'sprocket') return { aspect: 2, win: [0, 0, 1, 1], edge: 4, round: 0 };
  if (f.frame === 'bars') {
    const k = 16 / 9 / 2.39;
    return { aspect: 16 / 9, win: [0, (1 - k) / 2, 1, k], edge: 5, round: 0 };
  }
  let ratio = (!f.mode && RATIOS[S.ratio]) || f.ratio || 3 / 4;
  if (landscape && !f.fixed) ratio = 1 / ratio;
  if (f.frame === 'gate') {
    const b = .05 * Math.min(ratio, 1), W = ratio + 2 * b, H = 1 + 2 * b; // the same border width on every side
    return { aspect: W / H, win: [b / W, b / H, ratio / W, 1 / H], edge: 2, round: f.round ?? .015 };
  }
  return { aspect: ratio, win: [0, 0, 1, 1], edge: 0, round: 0 };
}

function borderOf(f) {
  if (f.card === 'random') return CARD_COLOURS[Math.floor(roll[2] * CARD_COLOURS.length)];
  return f.card || PAPER[f.frame] || (f.frame === 'mount' ? [.86, .85, .82] : [.03, .03, .03]);
}

const VERT = `
attribute vec2 pos;
varying vec2 uv;
void main() { uv = pos * .5 + .5; gl_Position = vec4(pos, 0., 1.); }`;

const FRAG = `
precision highp float;
varying vec2 uv;
uniform sampler2D vid, ovl;
uniform vec2 res;
uniform vec4 crop, win;
uniform float time, seed, hasOvl, flash, edge, edgeR, fisheye, prism, star;
uniform vec3 wb, shadowTint, highTint, roll, border;
uniform float exposure, sat, curve, black, white, soft, sharp, halation, bloom, lens, leak, vignette, grain, old, vhs, scan, dust, ir;
const vec3 LUMA = vec3(.299, .587, .114);

float hash(vec2 p) {
  vec3 q = fract(p.xyx * .1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + 1.), f.x), f.y);
}
vec3 tex(vec2 p) { return texture2D(vid, crop.xy + clamp(p, 0., 1.) * crop.zw).rgb; }

// Signed distance from a box with half-size b and corner radius r; negative inside.
float box(vec2 d, vec2 b, float r) {
  vec2 q = abs(d) - b + r;
  return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r;
}

// The picture. w runs 0..1 across the picture window and px is the window's size in pixels.
vec3 picture(vec2 w, vec2 px, vec2 fc, float t) {
  vec2 p = w;
  float pa = px.x / px.y;

  // Fisheye attachments bulge the middle: 1 is a circle on black, 2 fills the frame.
  float circle = 0.;
  if (fisheye > 0.) {
    float r = length((p - .5) * vec2(pa, 1.)) / (fisheye < 1.5 ? .5 * min(pa, 1.) : .5 * length(vec2(pa, 1.)));
    if (fisheye < 1.5) circle = r;
    p = .5 + (p - .5) * (.55 + .45 * r * r);
  }

  // Old film gate weave; VHS line wobble and a rolling tracking band.
  if (old > 0.) p += (vec2(hash(vec2(floor(t * 12.), 1.)), hash(vec2(floor(t * 12.), 2.))) - .5) * .004 * old;
  float band = 0.;
  if (vhs > 0.) {
    float line = floor(p.y * 240.);
    // a faint band rolls slowly down the frame; the bottom edge tears like a tape head switching
    band = smoothstep(.025, 0., abs(p.y - fract(-t * .06))) * .6 + smoothstep(.03, .005, p.y);
    p.x += ((hash(vec2(line, floor(t * 30.))) - .5) * .002 + band * (hash(vec2(line, t)) - .5) * .025) * vhs;
  }

  // Cheap lens: red and blue drift apart towards the edges.
  vec2 ca = (p - .5) * lens * .012;
  vec3 c = vec3(tex(p - ca).r, tex(p).g, tex(p + ca).b);

  // VHS keeps brightness fairly sharp but smears colour to the right.
  if (vhs > 0.) {
    vec3 s = vec3(0.);
    for (int i = 0; i < 6; i++) s += tex(p - vec2(float(i) * .004, 0.));
    s /= 6.;
    c = dot(c, LUMA) + (s - dot(s, LUMA));
  }

  // A small blur softens cheap lenses; the same blur taken away sharpens digital ones.
  if (soft > 0. || sharp > 0.) {
    vec3 b = vec3(0.);
    float rad = soft > 0. ? .004 : .0015;
    for (int i = 0; i < 8; i++) {
      float a = float(i) * .7854;
      b += tex(p + vec2(cos(a) / pa, sin(a)) * rad);
    }
    b /= 8.;
    c = mix(c, b, soft) + (c - b) * sharp * 1.5;
  }

  // Halation: bright light bleeds a warm red glow, as it does through film backing. Bloom is a soft white glow.
  vec3 glow = vec3(0.);
  if (halation > 0. || bloom > 0.) {
    vec3 g = vec3(0.);
    for (int i = 0; i < 8; i++) {
      float a = float(i) * .7854 + .39;
      g += tex(p + vec2(cos(a) / pa, sin(a)) * .018);
    }
    g /= 8.;
    float spill = smoothstep(.55, 1., dot(g, LUMA)) - smoothstep(.55, 1., dot(c, LUMA));
    glow = vec3(1., .32, .12) * max(spill, 0.) * halation + g * smoothstep(.35, 1., dot(g, LUMA)) * bloom * .6;
  }

  // Star filter: lights throw six-point stars. Only near-white light counts, so bright skin doesn't smear.
  if (star > 0.) {
    for (int k = 0; k < 3; k++) {
      float a = float(k) * 1.0472 + .2618;
      vec2 d = vec2(cos(a) / pa, sin(a)) * .007;
      float j = hash(fc + float(k)); // jittered steps blur into a smooth ray instead of a string of beads
      for (int i = 1; i < 11; i++) {
        vec3 x = tex(p + d * (float(i) - j)), y = tex(p - d * (float(i) - j));
        glow += (x * max(dot(x, LUMA) - .9, 0.) + y * max(dot(y, LUMA) - .9, 0.)) * (1. - float(i) / 11.) * 6.;
      }
    }
  }

  // Prism: a refracted copy of the scene drifts in from the left, with a rainbow along the prism's edge.
  if (prism > 0.) {
    vec2 g = vec2(.62 - p.x * .55, p.y * .96 + .02);
    vec3 ghost = vec3(tex(g + vec2(.01, 0.)).r, tex(g).g, tex(g - vec2(.01, 0.)).b);
    c = 1. - (1. - c) * (1. - ghost * smoothstep(.55, .05, p.x) * .55);
    c += smoothstep(.04, 0., abs(p.x - .32 - .03 * sin(p.y * 5.))) * .14 * (.5 + .5 * cos(6.2832 * (p.y * 1.3 + vec3(0., .33, .67))));
  }

  // On-camera flash: hard, slightly cool light that falls off fast towards the edges.
  if (flash > 0.) c *= vec3(.97, 1., 1.06) * (1.35 - length((p - .5) * vec2(pa, 1.)) * 1.1);

  // Infrared film swaps green and blue: leaves and sand go pink, skies go aqua.
  c = mix(c, c.rbg, ir);

  // Colour grade.
  c *= exposure * wb;
  c = clamp(mix(vec3(dot(c, LUMA)), c, sat), 0., 1.);
  c = mix(c, c * c * (3. - 2. * c), curve);
  float l = dot(c, LUMA);
  c += shadowTint * (1. - l) * (1. - l) + highTint * l * l;
  c = black + c * (white - black) + glow;

  // Light leak. Every shot rolls a new one (where it comes in, how big, how strong), so no two photos match.
  if (leak > 0.) {
    float a = roll.x * 6.2832;
    vec2 o = .5 + vec2(cos(a), sin(a)) * .62 + .04 * sin(t * .4);
    float m = smoothstep(.7 + roll.z * .5, 0., length(w - o));
    c = 1. - (1. - c) * (1. - leak * (.65 + roll.y * .35) * m * mix(vec3(1., .12 + roll.y * .25, .05), vec3(1., .75, .3), m));
  }

  c *= mix(1., smoothstep(1.6, .4, length(w - .5) * 2.), vignette);

  // Dust on the negative prints as pale specks, scattered fresh for every shot.
  if (dust > 0.) {
    vec2 g = fc / max(1., res.y / 360.);
    float d = step(.9993, hash(floor(g) + roll.xy * 917.)) * smoothstep(.5, .15, length(fract(g) - .5));
    c = mix(c, vec3(.95, .93, .88), d * dust);
  }

  // Date stamp or on-screen display, exposed after the lens so vignette skips it.
  if (hasOvl > 0.) {
    vec4 o = texture2D(ovl, uv);
    c = mix(c, o.rgb, o.a);
  }

  if (old > 0.) {
    float f = floor(t * 18.);
    c *= 1. + (hash(vec2(f, 3.)) - .5) * .14 * old;
    float x = hash(vec2(floor(t * 6.), 4.));
    c += step(.55, hash(vec2(floor(t * 6.), 5.))) * smoothstep(.0012, 0., abs(p.x - x - sin(p.y * 9. + f) * .002)) * .35 * old;
    c *= 1. - step(.9997, hash(floor(fc / 3.) + f * 7.)) * .8 * old;
  }

  // Film grain: soft clumps, strongest in the midtones.
  l = dot(c, LUMA);
  c += (vnoise(fc / max(1., res.y / 1000.) + seed * 1000.) - .5) * grain * (1.2 - abs(l - .5) * 1.4);

  if (scan > 0.) c *= 1. - scan * (.5 + .5 * sin(fc.y * 6.2832 * 240. / res.y));
  if (vhs > 0.) c += band * (hash(fc + t) - .5) * .5 * vhs;

  // Instant film: the picture sits slightly recessed in the card.
  if (edge == 1.) c *= .8 + .2 * smoothstep(0., .012, min(min(w.x, 1. - w.x), min(w.y, 1. - w.y)));

  // Panorama: the sprocket holes punched along the film, which the picture is exposed right over.
  if (edge == 4.) {
    vec2 s = vec2(mod(w.x * px.x, px.y * .136) - px.y * .068, (abs(w.y - .5) - .414) * px.y);
    c = mix(c, vec3(.02), smoothstep(1., -1., box(s, vec2(.04, .0286) * px.y, .008 * px.y)));
    c *= smoothstep(.5, .488, abs(w.y - .5)); // the film's own edge
  }

  // Round fisheye: black past the circle, darker towards its rim.
  if (circle > 0.) c *= smoothstep(1., .99, circle) * (1. - .3 * smoothstep(.7, 1., circle));
  return c;
}

void main() {
  vec2 fc = gl_FragCoord.xy, px = res * win.zw, w = (uv - win.xy) / win.zw;
  // Pixels past the picture's edge: an instant card, a film gate, a slide mount or widescreen bars.
  float outside = edge > 0. && edge != 4. ? box((w - .5) * px, px * .5, edgeR * min(px.x, px.y)) : -9.;
  float em = smoothstep(-1., 1., outside);
  vec3 c = vec3(0.);
  if (em < 1.) c = picture(w, px, fc, time);
  if (em > 0.) {
    vec3 b = border;
    if (edge == 1.) b -= hash(fc) * .025;
    else if (edge == 2.) b += (hash(fc) - .5) * .02;
    else if (edge == 3.) b *= 1. - .3 * smoothstep(min(px.x, px.y) * .04, 0., outside); // the mount's bevel shades the window
    c = mix(c, b, em);
    if (hasOvl > 0.) {
      vec4 o = texture2D(ovl, uv);
      c = mix(c, o.rgb, o.a * em);
    }
  }
  gl_FragColor = vec4(clamp(c, 0., 1.), 1.);
}`;

// ---------------------------------------------------------------------------
// WebGL
// ---------------------------------------------------------------------------
const gl = view.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
const loc = {};
let glOk = false, ovlKey = null;

function initGL() {
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.bindAttribLocation(prog, 0, 'pos');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); // one triangle covering the screen
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const names = ['vid', 'ovl', 'res', 'crop', 'win', 'time', 'seed', 'hasOvl', 'flash', 'edge', 'edgeR', 'fisheye', 'prism', 'star', 'roll', 'border'];
  for (const name of [...names, ...Object.keys(DEFAULTS)]) loc[name] = gl.getUniformLocation(prog, name);
  gl.uniform1i(loc.vid, 0);
  gl.uniform1i(loc.ovl, 1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  for (const unit of [0, 1]) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  ovlKey = null; // the overlay texture is new, so upload it again
  glOk = true;
}

// Cover-crop a sw x sh source into the picture's aspect ratio, zoomed in by zoom and nudged sideways by shift.
// A negative width mirrors it.
function cropFor(aspect, sw, sh, mirrored, zoom = 1, shift = 0) {
  const sa = sw / sh;
  const sx = (sa > aspect ? aspect / sa : 1) / zoom, sy = (sa > aspect ? 1 : sa / aspect) / zoom;
  const ox = clamp((1 - sx) / 2 + shift, 0, 1 - sx), oy = (1 - sy) / 2;
  return mirrored ? [ox + sx, oy, -sx, sy] : [ox, oy, sx, sy];
}

// The leak, dust and card colour for the next shot. Rerolled after every photo, like winding on to a fresh frame.
const rollFilm = () => [Math.random(), Math.random(), Math.random()];
let roll = rollFilm();

// Quick settings: exposure compensation, focal length and white balance.
// Focal length zooms freely from 26mm (the main lens) to 104mm; 13mm switches to the ultra-wide lens where there is one.
const MAIN = 26, WIDE = 13, MAX_FOCAL = 104;
// Fixing the white balance to k kelvin assumes the light is k: lower turns the picture bluer, higher warmer. 5500K daylight is neutral.
const kelvinWb = k => [(k / 5500) ** .3, 1, (5500 / k) ** .45];
const LEAKS = { off: 0, normal: 1, strong: 1.8 };
let ev = 0, focal = MAIN, wbK = 0, lensKind = 'none'; // wbK 0 is auto
let lensId = null, ultraId = null; // the ultra-wide camera in use, and the one the browser offers

// src is the camera, or an imported photo drawn on a canvas.
// shift nudges the crop sideways (the 3D camera's lenses); a fixed seed keeps grain still across a long exposure.
function draw(t, src = video, { mirrored = mirror, flash = 0, when = stampDate(), shift = 0, seed = Math.random() } = {}) {
  const f = CAMERAS[current];
  gl.viewport(0, 0, view.width, view.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  updateOverlay(f, when);
  const pictureAspect = view.width * fmt.win[2] / (view.height * fmt.win[3]);
  gl.uniform2f(loc.res, view.width, view.height);
  gl.uniform4fv(loc.win, fmt.win);
  // shortcut: zoom crops the camera frame, so it softens past about 2x; use the track's zoom constraint where browsers expose it if that matters.
  const zoom = src === video ? Math.max(1, focal / (lensId ? WIDE : MAIN)) : 1; // imported photos keep their framing
  gl.uniform4fv(loc.crop, cropFor(pictureAspect, src.videoWidth || src.width, src.videoHeight || src.height, mirrored, zoom, shift));
  gl.uniform1f(loc.edge, fmt.edge);
  gl.uniform1f(loc.edgeR, fmt.round);
  gl.uniform3fv(loc.border, borderOf(f));
  gl.uniform1f(loc.time, t / 1000 % 1000);
  gl.uniform1f(loc.seed, seed);
  gl.uniform3fv(loc.roll, roll);
  gl.uniform1f(loc.flash, flash);
  gl.uniform1f(loc.hasOvl, ovlKey ? 1 : 0);
  gl.uniform1f(loc.fisheye, lensKind === 'fisheye' ? 1 : lensKind === 'wide' ? 2 : 0);
  gl.uniform1f(loc.prism, +(lensKind === 'prism'));
  gl.uniform1f(loc.star, +(lensKind === 'star'));
  for (const k in DEFAULTS) {
    let v = f[k] ?? DEFAULTS[k];
    if (k === 'exposure') v *= 2 ** ev;
    else if (k === 'wb' && wbK) v = v.map((x, i) => x * kelvinWb(wbK)[i]);
    else if (k === 'leak') v *= LEAKS[S.leaks] ?? 1;
    Array.isArray(v) ? gl.uniform3fv(loc[k], v) : gl.uniform1f(loc[k], +v);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------------------------------------------------------------------------
// Overlays: the LED date stamp, camcorder displays, film-edge markings and the slide mount's label
// ---------------------------------------------------------------------------
const ovl = document.createElement('canvas'), octx = ovl.getContext('2d');
const SEGMENTS = [0x3f, 0x06, 0x5b, 0x4f, 0x66, 0x6d, 0x7d, 0x07, 0x7f, 0x6f]; // seven-segment bits a..g per digit
const blankPad = n => String(n).padStart(2, '_');
const stampText = d => `'${String(d.getFullYear() % 100).padStart(2, '0')} ${blankPad(d.getMonth() + 1)} ${blankPad(d.getDate())}`;
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

// The date to print: the moment itself, or the custom date from settings at the same time of day.
function stampDate(d = new Date()) {
  if (S.date !== 'custom' || !S.custom) return d;
  const [y, m, day] = S.custom.split('-').map(Number), c = new Date(d);
  c.setFullYear(y, m - 1, day);
  return c;
}

function updateOverlay(f, d) {
  const stamp = S.date !== 'off' && f.stamp !== false, frameNo = f.marks ? 1 + Math.floor(roll[1] * 36) : 0, mount = fmt.edge === 3;
  const clock = f.osd === 'dv' ? Math.floor(d / 1000) : f.osd ? Math.floor(d / 60000) : '';
  const key = stamp || frameNo || mount ? [f.name, view.width, view.height, stamp && d.toDateString(), stamp && clock, frameNo, mount && d.getFullYear() * 12 + d.getMonth()].join() : '';
  if (key === ovlKey) return;
  ovlKey = key;
  if (!key) return;
  const W = ovl.width = view.width, H = ovl.height = view.height;
  const x = fmt.win[0] * W, y = (1 - fmt.win[1] - fmt.win[3]) * H, w = fmt.win[2] * W, h = fmt.win[3] * H, m = Math.min(w, h);
  if (stamp && f.osd === 'vhs') vhsOsd(octx, d, x, y, w, h);
  else if (stamp && f.osd === 'dv') dvOsd(octx, d, x, y, w, h);
  else if (stamp) dateStamp(octx, d, x + w - m * .07, y + h - m * .08, m * .045);
  if (frameNo) edgeMarks(octx, frameNo, x, y, w, h);
  if (mount) mountLabel(octx, d, y + h, W, H);
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ovl);
}

// Glowing orange seven-segment digits, like the date a 90s point-and-shoot burned into the film.
// right and bottom place the stamp's corner; h is the digit height.
function dateStamp(c, d, right, bottom, h) {
  const text = stampText(d), w = h * .55, t = h * .18, half = h / 2, s = half - t * 1.5;
  const advance = ch => ch === "'" ? h * .3 : ch === ' ' ? h * .35 : w + h * .22;
  const segs = [[t, 0, w - 2 * t, t], [w - t, t, t, s], [w - t, half + t / 2, t, s], [t, h - t, w - 2 * t, t], [0, half + t / 2, t, s], [0, t, t, s], [t, half - t / 2, w - 2 * t, t]];
  c.save();
  c.translate(right - [...text].reduce((sum, ch) => sum + advance(ch), 0), bottom - h);
  c.transform(1, 0, -.1, 1, h * .1, 0); // slight italic slant, like the real LEDs
  c.fillStyle = '#ffab3d';
  c.shadowColor = 'rgba(255, 96, 0, .9)';
  c.shadowBlur = h * .45;
  for (let pass = 0; pass < 2; pass++) { // second pass builds up the bloom
    let x = 0;
    for (const ch of text) {
      if (ch === "'") c.fillRect(x, 0, t, h * .3);
      else if (ch >= '0' && ch <= '9') segs.forEach(([sx, sy, sw, sh], i) => SEGMENTS[ch] >> i & 1 && c.fillRect(x + sx, sy, sw, sh));
      x += advance(ch);
    }
  }
  c.restore();
}

// A play arrow, drawn rather than typed: iOS would turn the ▶ character into an emoji.
function arrow(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y);
  c.lineTo(x + s * .62, y + s * .35);
  c.lineTo(x, y + s * .7);
  c.fill();
}

function vhsOsd(c, d, x, y, w, h) {
  const m = Math.min(w, h), s = m * .06, pad = m * .07;
  c.font = `600 ${s}px ${MONO}`;
  c.fillStyle = '#fff';
  c.shadowColor = 'rgba(0, 0, 0, .65)';
  c.shadowOffsetX = c.shadowOffsetY = s * .08;
  c.textBaseline = 'top';
  c.fillText('PLAY', x + pad, y + pad);
  arrow(c, x + pad + c.measureText('PLAY ').width, y + pad + s * .05, s);
  c.textBaseline = 'alphabetic';
  c.fillText(d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }), x + pad, y + h - pad - s * 1.4);
  c.fillText(d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }).toUpperCase().replace(',', ''), x + pad, y + h - pad);
}

// A 2000s digital camcorder: plain white date and time, bottom right, to the second.
function dvOsd(c, d, x, y, w, h) {
  const m = Math.min(w, h), s = m * .05, pad = m * .07;
  c.font = `500 ${s}px ${MONO}`;
  c.fillStyle = '#fff';
  c.shadowColor = 'rgba(0, 0, 0, .7)';
  c.shadowOffsetX = c.shadowOffsetY = s * .07;
  c.textAlign = 'right';
  c.fillText(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase().replace(',', ''), x + w - pad, y + h - pad - s * 1.3);
  c.fillText(d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' }), x + w - pad, y + h - pad);
}

// Amber printing along the film's edge, as a scanned negative shows it: frame numbers above, the stock below.
function edgeMarks(c, no, x, y, w, h) {
  const s = y * .42;
  c.font = `600 ${s}px ${MONO}`;
  c.fillStyle = 'rgba(236, 160, 64, .85)';
  c.textBaseline = 'middle';
  c.fillText(String(no), x + w * .08, y / 2);
  arrow(c, x + w * .08 + c.measureText(`${no} `).width, y / 2 - s * .35, s);
  c.fillText(`${no}A`, x + w * .66, y / 2);
  c.fillText('SAFETY FILM 400', x + w * .08, y + h + y / 2);
  c.fillText(String(no + 1), x + w * .8, y + h + y / 2);
}

// The month and year a lab stamped on the slide mount, under the picture.
function mountLabel(c, d, bottom, W, H) {
  c.font = `600 ${W * .03}px -apple-system, system-ui, sans-serif`;
  c.fillStyle = 'rgba(60, 58, 54, .7)';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }).toUpperCase(), W / 2, (bottom + H) / 2);
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const video = document.createElement('video');
video.muted = video.playsInline = true;
video.setAttribute('playsinline', '');
// iOS only keeps decoding camera frames for videos that are in the document.
const HIDDEN_STYLE = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
video.style.cssText = HIDDEN_STYLE;
document.body.append(video);

let stream = null, facing = 'environment', mirror = false, live = false, startToken = 0;

const ERRORS = {
  InsecureContext: ['Camera needs a secure page', 'Browsers only allow the camera over https. Open this page from an https:// address.'],
  NotAllowedError: ['Camera access is off', 'Allow camera access for this site in your browser settings, then try again.'],
  NotFoundError: ['No camera found', 'Connect a camera, then try again.'],
  OverconstrainedError: ['No camera found', 'Connect a camera, then try again.'],
  NotReadableError: ['Camera is busy', 'Another app is using the camera. Close it, then try again.'],
  NoWebGL: ['Film effects can’t run here', 'This browser has WebGL turned off, and the filters need it.'],
};

function showStatus(e) {
  $('status').hidden = !e;
  if (!e) return;
  const [title, text] = ERRORS[e.name] || ['Camera unavailable', 'Something went wrong while starting the camera. Try again.'];
  $('statusTitle').textContent = title;
  $('statusBody').textContent = text;
  $('retry').hidden = e.name === 'InsecureContext' || e.name === 'NoWebGL';
}

function stop() {
  endCount();
  if (rec) stopRecording();
  stream?.getTracks().forEach(t => t.stop());
  stream = video.srcObject = null;
  live = false;
  shutter.disabled = true;
}

async function start() {
  stop();
  const token = ++startToken;
  try {
    if (!glOk) throw new DOMException('', 'NoWebGL');
    if (!window.isSecureContext || !navigator.mediaDevices) throw new DOMException('', 'InsecureContext');
    const lens = lensId ? { deviceId: { exact: lensId } } : { facingMode: facing };
    const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...lens, width: { ideal: 1920 }, height: { ideal: 1440 } } });
    // A newer start() won the race, or the app went to the background while the prompt was up.
    if (token !== startToken || document.hidden) return s.getTracks().forEach(t => t.stop());
    stream = video.srcObject = s;
    // Desktop webcams usually don't report facingMode, so treat them as selfie cameras.
    mirror = (s.getVideoTracks()[0].getSettings().facingMode || 'user') === 'user';
    await video.play();
    showStatus(null);
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    flip.style.visibility = cams.length > 1 ? '' : 'hidden';
    // shortcut: found by name (iPhone calls it "Back Ultra Wide Camera"); phones that don't name it get no 13mm.
    ultraId = mirror ? null : cams.find(d => /ultra ?wide/i.test(d.label))?.deviceId ?? null;
    syncDials();
  } catch (e) {
    if (token !== startToken) return;
    if (lensId) { lensId = null; focal = MAIN; return start(); } // the ultra-wide wouldn't open: back to the main lens
    showStatus(e);
  }
}

// ~30 fps looks like film and halves the GPU work; nothing renders while the gallery covers the viewfinder.
let lastFrame = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastFrame < 30 || !glOk || !viewer.hidden || video.readyState < 2) return;
  lastFrame = t;
  draw(t);
  if (!live) {
    live = true;
    shutter.disabled = busy;
    view.classList.add('live');
    view.classList.remove('switching');
  }
}

// Fit the camera's format into the viewfinder. shortcut: fixed 1440px render; raise LONG_SIDE if photos need more resolution.
const LONG_SIDE = 1440;
let fmt = formatOf(CAMERAS[0], false);
function layout() {
  const box = finder.getBoundingClientRect();
  if (!box.width || !box.height) return;
  if (!rec) setFormat(formatOf(CAMERAS[current], box.width > box.height)); // a clip keeps its size while it records
  const h = Math.min(box.height, box.width / fmt.aspect);
  frameEl.style.width = `${h * fmt.aspect}px`;
  frameEl.style.height = `${h}px`;
}

function setFormat(f) {
  fmt = f;
  const w = Math.round(f.aspect > 1 ? LONG_SIDE : LONG_SIDE * f.aspect), h = Math.round(f.aspect > 1 ? LONG_SIDE / f.aspect : LONG_SIDE);
  if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
}

// ---------------------------------------------------------------------------
// Camera drawer: the camera button opens every camera, grouped like a camera bag, with lens attachments below.
// ---------------------------------------------------------------------------
let current = Math.max(0, CAMERAS.findIndex(f => f.name === 'Disposable'));
try {
  const saved = CAMERAS.findIndex(f => f.name === localStorage.getItem('film'));
  if (saved >= 0) current = saved;
} catch {}
const hiddenCams = new Set(S.hidden);
let editing = false;

const camButtons = CAMERAS.map((f, i) => {
  const b = document.createElement('button');
  b.className = 'cam';
  b.innerHTML = `<svg viewBox="0 0 64 48" aria-hidden="true">${ART[f.name]}</svg><span>${f.name}</span>${EYE_SLASH}`;
  b.onclick = () => pickCamera(i);
  return b;
});
const camGroups = GROUPS.map(([id, title]) => {
  const section = document.createElement('section'), grid = document.createElement('div');
  section.className = 'cam-group';
  section.innerHTML = `<h3>${title}</h3>`;
  grid.className = 'cam-grid';
  grid.append(...camButtons.filter((_, i) => CAMERAS[i].group === id));
  section.append(grid);
  $('camList').append(section);
  return section;
});

const lensButtons = LENSES.map(([id, label]) => {
  const b = document.createElement('button');
  b.className = 'lens';
  b.setAttribute('role', 'radio');
  b.innerHTML = `<svg viewBox="0 0 64 48" aria-hidden="true">${LENS_ART[id]}</svg><span>${label}</span>`;
  b.onclick = () => { lensKind = id; syncLenses(); };
  $('lensRow').append(b);
  return b;
});

// ND needs a still shutter, so it is off for video and burst cameras.
const ndWorks = f => !f.video && f.mode !== 'sequence' && f.mode !== 'wiggle';

function syncCams() {
  camButtons.forEach((b, i) => {
    const off = hiddenCams.has(CAMERAS[i].name);
    b.classList.toggle('off', off);
    b.hidden = off && !editing;
    if (i === current) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
    if (editing) b.setAttribute('aria-pressed', !off);
    else b.removeAttribute('aria-pressed');
  });
  camGroups.forEach(s => { s.hidden = [...s.querySelectorAll('.cam')].every(b => b.hidden); });
  camSheet.classList.toggle('editing', editing);
  $('edit').textContent = editing ? 'Done' : 'Edit';
  const f = CAMERAS[current];
  $('about').innerHTML = editing ? 'Tap a camera to hide it from this list, or to bring it back.' : `<strong>${f.name}</strong> ${f.about}`;
}

function syncLenses() {
  const f = CAMERAS[current];
  if (lensKind === 'nd' && !ndWorks(f)) lensKind = 'none';
  lensButtons.forEach((b, i) => {
    const [id, label, about] = LENSES[i];
    b.setAttribute('aria-checked', id === lensKind);
    b.disabled = id === 'nd' && !ndWorks(f);
    b.title = about;
    b.setAttribute('aria-label', `${label}. ${about}`);
  });
  const lensName = LENSES.find(([id]) => id === lensKind)[1];
  $('camName').textContent = lensKind === 'none' ? f.name : `${f.name} · ${lensName}`;
}

function pickCamera(i) {
  if (editing) {
    const name = CAMERAS[i].name;
    hiddenCams.has(name) ? hiddenCams.delete(name) : hiddenCams.add(name);
    S.hidden = [...hiddenCams];
    saveSettings();
    return syncCams();
  }
  setFilm(i);
  closeSheet(camSheet);
}

function setFilm(i) {
  if (i < 0 || i >= CAMERAS.length) return;
  const changed = i !== current, f = CAMERAS[i];
  current = i;
  if (pending && pending.name !== f.name) { pending = null; showPending(); } // a half-finished collage belongs to its camera
  camBtn.firstElementChild.innerHTML = ART[f.name];
  camBtn.setAttribute('aria-label', `Choose camera. Current: ${f.name}`);
  shutter.classList.toggle('video', !!f.video);
  try { localStorage.setItem('film', f.name); } catch {}
  if (changed && navigator.userActivation?.hasBeenActive) navigator.vibrate?.(4); // a tick per camera on Android
  setShutterLabel();
  syncCams();
  syncLenses();
  setTools();
  layout();
}

// Swipe sideways on the viewfinder for the next camera in the drawer; hidden ones are skipped.
function stepCamera(dir) {
  for (let i = current + dir; i >= 0 && i < CAMERAS.length; i += dir) if (!hiddenCams.has(CAMERAS[i].name)) return setFilm(i);
}

// Swipe sideways on the viewfinder to change camera; double-tap to switch front and back, like the system camera.
// Two fingers pinch to zoom; a mouse wheel or trackpad pinch zooms too.
let touch = null, lastTap = 0, pinch = null, zoomHud = 0;
const fingers = new Map();
const spread = () => { const [a, b] = fingers.values(); return Math.hypot(a[0] - b[0], a[1] - b[1]); };

let lensTimer = 0;
function setFocal(mm) {
  if (busy) return; // a burst or long exposure keeps its framing
  // A clip can't change lens mid-recording, so the zoom stays within the lens in use.
  focal = clamp(mm, (ultraId && !rec) || lensId ? WIDE : MAIN, MAX_FOCAL);
  syncDials();
  setHud(`${Math.round(focal)}mm`);
  clearTimeout(zoomHud);
  zoomHud = setTimeout(showPending, 900);
  clearTimeout(lensTimer);
  lensTimer = setTimeout(matchLens, 300); // once the fingers settle, not on every move
}

// Under 26mm needs the ultra-wide lens; from 26mm up the main lens is sharper than a crop of the wide one.
function matchLens() {
  const want = ultraId && focal < MAIN ? ultraId : null;
  if (want === lensId || rec || busy) return;
  lensId = want;
  view.classList.add('switching');
  start();
}

finder.addEventListener('pointerdown', e => {
  if (e.target.closest('button, input')) return;
  finder.setPointerCapture(e.pointerId); // the lift reaches us even off the viewfinder, so no finger gets stuck
  fingers.set(e.pointerId, [e.clientX, e.clientY]);
  touch = fingers.size === 1 ? { x: e.clientX, y: e.clientY } : null; // two fingers are a zoom, never a swipe or a tap
  if (fingers.size === 2) pinch = { spread: Math.max(spread(), 1), focal };
});
finder.addEventListener('pointermove', e => {
  if (!fingers.has(e.pointerId)) return;
  fingers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && fingers.size === 2) setFocal(pinch.focal * spread() / pinch.spread);
});
const lift = e => {
  fingers.delete(e.pointerId);
  if (fingers.size < 2) pinch = null;
};
finder.addEventListener('pointercancel', lift);
finder.addEventListener('gesturestart', e => e.preventDefault()); // iOS: pinch zooms the camera, not the page
finder.addEventListener('wheel', e => {
  e.preventDefault();
  const dy = e.deltaY * (e.deltaMode ? 16 : 1); // some browsers scroll in lines
  setFocal(focal * Math.exp(-dy * (e.ctrlKey ? .01 : .002))); // ctrl is a trackpad pinch: smaller steps, more of them
}, { passive: false });
finder.addEventListener('pointerup', e => {
  lift(e);
  if (!touch || rec || busy) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) return stepCamera(dx < 0 ? 1 : -1);
  if (Math.hypot(dx, dy) > 10) return;
  showPanel();
  if (e.timeStamp - lastTap < 300 && flip.style.visibility !== 'hidden') { lastTap = 0; return switchCamera(); }
  lastTap = e.timeStamp;
});

function switchCamera() {
  facing = facing === 'user' ? 'environment' : 'user';
  lensId = null; // the selfie side has no ultra-wide here
  focal = Math.max(focal, MAIN);
  view.classList.add('switching');
  if (!reduceMotion.matches) flip.firstElementChild.animate([{ transform: 'rotate(-180deg)' }, { transform: 'none' }], spring(.5));
  start();
}

// One quick-settings panel opens at a time; its button turns into a chevron that closes it, as in Dazz.
const QUICK = { wb: $('qWb'), focal: $('qFocal'), ev: $('qEv') };
const focalButtons = [...document.querySelectorAll('.lensbtn')];
let openPanel = null;
function showPanel(name = null) {
  openPanel = name;
  for (const [k, pill] of Object.entries(QUICK)) {
    pill.classList.toggle('open', k === name);
    pill.setAttribute('aria-expanded', k === name);
    $(`${k}Panel`).hidden = k !== name;
  }
  $('camName').hidden = !!name;
}

function syncDials() {
  const evText = ev ? `${ev > 0 ? '+' : '−'}${Math.abs(ev).toFixed(1)}` : '0.0';
  $('qEvVal').textContent = ev ? evText : '0';
  $('qEvAuto').hidden = ev !== 0;
  $('qEv').setAttribute('aria-label', `Exposure ${ev ? evText : 'auto'}`);
  $('evOut').textContent = evText;
  $('evRange').value = ev;
  $('evAuto').setAttribute('aria-pressed', ev === 0);
  const mm = Math.round(focal);
  $('qFocalVal').textContent = mm;
  $('qFocal').setAttribute('aria-label', `Focal length ${mm} millimetres. Pinch the viewfinder to zoom`);
  for (const b of focalButtons) {
    b.hidden = +b.dataset.mm < MAIN && !ultraId && !lensId;
    b.setAttribute('aria-pressed', +b.dataset.mm === mm);
  }
  $('wbOut').textContent = wbK ? `${wbK}K` : 'Auto';
  $('wbRange').value = wbK || 5500;
  $('wbAuto').setAttribute('aria-pressed', !wbK);
  $('wbSun').setAttribute('aria-pressed', wbK === 5500);
  $('wbBulb').setAttribute('aria-pressed', wbK === 3200);
  $('qWb').classList.toggle('set', !!wbK);
  $('qWb').setAttribute('aria-label', `White balance ${wbK ? `${wbK} kelvin` : 'auto'}`);
}

// ---------------------------------------------------------------------------
// Sheets: slide up from the bottom, drag the top down to dismiss, tap outside to close
// ---------------------------------------------------------------------------
let sheetOpener = null;
const translateY = el => { const t = getComputedStyle(el).transform; return t === 'none' ? 0 : new DOMMatrix(t).f; };

function openSheet(sheet, opener) {
  sheetOpener = opener;
  showPanel();
  sheet.hidden = false;
  app.inert = true;
  const panel = sheet.querySelector('.panel'), scrim = sheet.querySelector('.scrim');
  if (reduceMotion.matches) animate(sheet, [{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
  else {
    animate(panel, [{ transform: 'translateY(100%)' }, { transform: 'translateY(0px)' }], spring(.4));
    animate(scrim, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
  }
  sheet.querySelector('.text-btn').focus({ preventScroll: true });
}

// v is the finger's downward speed in px/s, handed to the spring so a flick carries on.
async function closeSheet(sheet, v = 0) {
  if (sheet.hidden || sheet.dataset.closing) return;
  sheet.dataset.closing = 1;
  const panel = sheet.querySelector('.panel'), scrim = sheet.querySelector('.scrim'), y = translateY(panel), h = panel.offsetHeight;
  const o = getComputedStyle(scrim).opacity;
  [panel, scrim].forEach(el => el.getAnimations().forEach(a => a.cancel())); // closed while still opening: leave from where it is
  let anims;
  if (reduceMotion.matches) anims = [animate(sheet, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 })];
  else anims = [
    animate(panel, [{ transform: `translateY(${y}px)` }, { transform: `translateY(${h}px)` }], spring(.35, clamp(v / Math.max(h - y, 1), 0, 20))),
    animate(scrim, [{ opacity: o }, { opacity: 0 }], { duration: 220, easing: 'ease-out' }),
  ];
  await Promise.all(anims.map(a => a.finished.catch(() => {})));
  sheet.hidden = true;
  for (const el of [sheet, panel, scrim]) el.removeAttribute('style');
  delete sheet.dataset.closing;
  app.inert = false;
  if (editing) { editing = false; syncCams(); }
  sheetOpener?.focus({ preventScroll: true });
}

for (const sheet of [camSheet, setSheet]) {
  const panel = sheet.querySelector('.panel'), head = sheet.querySelector('.sheet-head'), scrim = sheet.querySelector('.scrim');
  scrim.onclick = () => closeSheet(sheet);
  sheet.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(sheet); });
  let d = null;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || sheet.dataset.closing) return;
    const from = translateY(panel); // grabbed mid-flight: carry on from where it is on screen
    panel.getAnimations().forEach(a => a.cancel());
    panel.style.transform = `translateY(${from}px)`;
    d = { id: e.pointerId, y: e.clientY, from, at: from, hist: [] };
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    const raw = d.from + e.clientY - d.y;
    d.at = raw >= 0 ? raw : -rubberband(-raw, innerHeight);
    panel.style.transform = `translateY(${d.at}px)`;
    scrim.style.opacity = String(1 - clamp(d.at / panel.offsetHeight, 0, 1));
    d.hist.push([e.timeStamp, e.clientY]);
    if (d.hist.length > 5) d.hist.shift();
  });
  const end = e => {
    if (!d || e.pointerId !== d.id) return;
    const { at, hist } = d, a = hist[0], b = hist.at(-1);
    d = null;
    // A finger that stopped before lifting has no velocity left to hand over.
    const v = a && b[0] > a[0] && e.timeStamp - b[0] < 80 ? (b[1] - a[1]) / (b[0] - a[0]) * 1000 : 0;
    if (at + project(v) > panel.offsetHeight * .3) return closeSheet(sheet, Math.max(v, 0));
    const back = spring(.35, at > 0 ? clamp(-v / at, 0, 20) : 0);
    animate(panel, [{ transform: `translateY(${at}px)` }, { transform: 'translateY(0px)' }], back);
    animate(scrim, [{ opacity: scrim.style.opacity || 1 }, { opacity: 1 }], back);
  };
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', end);
}

// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------
function applySettings() {
  setSheet.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', S[seg.dataset.key] === b.dataset.v)));
  $('customRow').hidden = S.date !== 'custom';
  if ($('customDate').value !== S.custom) $('customDate').value = S.custom;
  $('gridSw').checked = S.grid;
  $('soundSw').checked = S.sound;
  $('gridLines').hidden = !S.grid;
  ovlKey = null;
  setTools();
  layout();
}

setSheet.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => {
  b.setAttribute('role', 'radio');
  b.onclick = () => {
    S[seg.dataset.key] = b.dataset.v;
    if (S.date !== 'off') S.lastDate = S.date;
    if (S.date === 'custom' && !S.custom) S.custom = new Date().toLocaleDateString('en-CA'); // yyyy-mm-dd
    saveSettings();
    applySettings();
  };
}));
$('customDate').onchange = e => { S.custom = e.target.value; saveSettings(); applySettings(); };
$('gridSw').onchange = e => { S.grid = e.target.checked; saveSettings(); applySettings(); };
$('soundSw').onchange = e => { S.sound = e.target.checked; saveSettings(); applySettings(); };

// ---------------------------------------------------------------------------
// Motion helpers
// ---------------------------------------------------------------------------
const SUPPORTS_LINEAR = CSS.supports('animation-timing-function', 'linear(0, 1)');

// Critically damped spring (Apple's damping 1.0) baked into a CSS linear() easing.
// response is in seconds; v is the starting velocity as a fraction of the distance per second.
function spring(response = .4, v = 0) {
  const w = 2 * Math.PI / response, x = t => 1 + ((v - w) * t - 1) * Math.exp(-w * t);
  let d = 0;
  while (Math.exp(-w * d) * (1 + Math.abs(v - w) * d) > 1e-3) d += .01;
  const pts = Array.from({ length: 48 }, (_, i) => +x(i / 47 * d).toFixed(4));
  pts[47] = 1;
  return { duration: d * 1000, easing: SUPPORTS_LINEAR ? `linear(${pts})` : 'cubic-bezier(.2, .9, .3, 1)' };
}

// Momentum projection (Apple's deceleration formula): where a flick would come to rest.
const project = v => v / 1000 * .99 / (1 - .99);
const rubberband = (o, dim, c = .55) => o * dim * c / (dim + c * o);

// Runs a Web Animation, then bakes the end state into inline style so nothing snaps back.
function animate(el, frames, opts) {
  const a = el.animate(frames, { fill: 'both', ...opts });
  a.finished.then(() => { Object.assign(el.style, frames.at(-1)); a.cancel(); }, () => {});
  return a;
}

// ---------------------------------------------------------------------------
// Shutter
// ---------------------------------------------------------------------------
let audio = null, noise = null;
function shutterSound() {
  if (!S.sound) return;
  try {
    audio ||= new AudioContext();
    if (!noise) {
      noise = audio.createBuffer(1, audio.sampleRate * .06, audio.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = audio.currentTime;
    // Two short clicks: the first and second shutter curtain.
    for (const [at, level, freq] of [[0, .35, 3200], [.07, .22, 2200]]) {
      const src = audio.createBufferSource(), band = audio.createBiquadFilter(), gain = audio.createGain();
      src.buffer = noise;
      band.type = 'bandpass';
      band.frequency.value = freq;
      band.Q.value = 1.2;
      gain.gain.setValueAtTime(level, t0 + at);
      gain.gain.exponentialRampToValueAtTime(.001, t0 + at + .045);
      src.connect(band).connect(gain).connect(audio.destination);
      src.start(t0 + at, 0, .05);
    }
  } catch {}
}

// A self-timer or record beep.
function beep(freq = 1760) {
  if (!S.sound) return;
  try {
    audio ||= new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime;
    o.frequency.value = freq;
    g.gain.setValueAtTime(.06, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + .09);
    o.connect(g).connect(audio.destination);
    o.start(t0);
    o.stop(t0 + .09);
  } catch {}
}

const TIMERS = [0, 3, 10];
let flashOn = false, timer = 0, doubleOn = false, counting = 0;
let busy = false;    // a burst, long exposure or developing clip is running
let pending = null;  // a half frame, collage or double exposure waiting for more shots: { kind, name, need, shots }
let rec = null;      // the clip being recorded

function setTools() {
  const f = CAMERAS[current];
  $('flash').setAttribute('aria-pressed', flashOn);
  $('date').setAttribute('aria-pressed', S.date !== 'off');
  $('double').setAttribute('aria-pressed', doubleOn && !f.mode && !f.video);
  $('double').disabled = !!(f.mode || f.video || rec);
  $('import').disabled = !!(f.video || f.mode === 'sequence' || f.mode === 'wiggle' || rec);
  $('timer').classList.toggle('set', timer > 0);
  $('timer').setAttribute('aria-label', timer ? `Self-timer, ${timer} seconds` : 'Self-timer off');
  $('timerLabel').textContent = timer ? `${timer}s` : '';
}

function setShutterLabel() {
  shutter.setAttribute('aria-label', rec ? 'Stop recording' : counting ? 'Cancel self-timer' : CAMERAS[current].video ? 'Record video' : 'Take photo');
}

function setBusy(on) {
  busy = on;
  shutter.disabled = on || !live;
}

// The pill over the viewfinder: shot progress (tap to cancel) or a short instruction.
function setHud(text, cancel = false) {
  const h = $('hud');
  clearTimeout(zoomHud); // a newer message outlives the zoom readout
  h.hidden = !text;
  h.disabled = !cancel;
  $('hudText').textContent = text;
  if (!cancel) h.removeAttribute('aria-label');
}

const PENDING = { half: 'Half frame', collage: 'Collage', double: 'Double exposure' };
function showPending() {
  const p = pending;
  setHud(p ? `${PENDING[p.kind]} ${p.shots.length}/${p.need}` : '', !!p);
  if (p) $('hud').setAttribute('aria-label', `Cancel ${PENDING[p.kind].toLowerCase()}, ${p.shots.length} of ${p.need} taken`);
  // A double exposure shows its first frame as a ghost, so you can line up the second.
  ghost.hidden = p?.kind !== 'double';
  if (!ghost.hidden) {
    const [s] = p.shots;
    ghost.width = s.width;
    ghost.height = s.height;
    ghost.getContext('2d').drawImage(s, 0, 0);
  }
}

// The shutter button. With the self-timer on it counts down first, and tapping again cancels.
async function shoot() {
  if (rec) return stopRecording();
  if (counting) return endCount();
  if (busy) return;
  if (timer) {
    const id = counting = performance.now();
    shutter.classList.add('counting');
    setShutterLabel();
    for (let i = timer; i > 0; i--) {
      count.textContent = i;
      beep();
      if (!reduceMotion.matches) count.animate([{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'none' }], spring(.35));
      await wait(1000);
      if (counting !== id) return;
    }
    endCount();
  }
  CAMERAS[current].video ? startRecording() : capture();
}

function endCount() {
  counting = 0;
  count.textContent = '';
  shutter.classList.remove('counting');
  setShutterLabel();
}

// Real light where the phone has one: the torch behind, a white screen in front. Returns a function that turns it off.
async function lightsOn() {
  if (mirror) {
    screenFlash.hidden = false;
    await wait(250); // let the camera expose for the extra light
    return () => animate(screenFlash, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }).finished.then(() => {
      screenFlash.hidden = true;
      screenFlash.removeAttribute('style');
    }, () => {});
  }
  const track = stream?.getVideoTracks()[0];
  if (!track?.getCapabilities?.().torch) return null;
  try { await track.applyConstraints({ advanced: [{ torch: true }] }); } catch { return null; }
  await wait(400);
  return () => track.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
}

const canvas = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const blobOf = c => new Promise(res => c.toBlob(res, 'image/jpeg', .92));
function copy(src, k = 1) {
  const c = canvas(Math.round(src.width * k), Math.round(src.height * k));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

async function capture() {
  if (!live || busy) return;
  const f = CAMERAS[current];
  if (f.mode === 'sequence' || f.mode === 'wiggle') return burst(f);
  const shot = await expose();
  if (shot) take(f, shot);
}

// One exposure through the current camera, copied off the viewfinder: with the flash, and held open behind an ND lens.
async function expose() {
  const flash = flashOn, nd = lensKind === 'nd';
  setBusy(true);
  const lightsOff = flash ? await lightsOn() : null;
  if (!live) { lightsOff?.(); setBusy(false); return null; } // the camera stopped while the light came on
  shutterSound();
  navigator.vibrate?.(12);
  let shot;
  if (nd) {
    setHud('Hold still…');
    shot = await longExposure(+flash);
    showPending();
  } else {
    draw(performance.now(), video, { flash: +flash }); // render this exact moment into the buffer
    shot = copy(view);
  }
  lightsOff?.();
  roll = rollFilm();
  setBusy(false);
  if (!reduceMotion.matches) view.animate([{ opacity: .1 }, { opacity: 1 }], { duration: 280, easing: 'ease-out' });
  return shot;
}

// ND filter: about a second of frames averaged together, so anything moving smears into trails.
async function longExposure(flash) {
  const acc = canvas(view.width, view.height), c = acc.getContext('2d'), seed = Math.random();
  for (let i = 0; i < 16 && live; i++) {
    if (i) await wait(66);
    draw(performance.now(), video, { flash: i ? 0 : flash, seed }); // the flash fires once, at the start
    c.globalAlpha = 1 / (i + 1);
    c.drawImage(view, 0, 0);
  }
  return acc;
}

// A finished exposure either makes a photo or waits for the rest of its half frame, collage or double exposure.
function take(f, shot) {
  const kind = f.mode === 'half' || f.mode === 'collage' ? f.mode : doubleOn && !f.mode ? 'double' : null;
  if (!kind) return save(shot, f.name);
  if (pending?.kind !== kind || pending.name !== f.name) pending = { kind, name: f.name, need: kind === 'collage' ? 4 : 2, shots: [] };
  pending.shots.push(shot);
  if (pending.shots.length < pending.need) return showPending();
  const p = pending;
  pending = null;
  showPending();
  return save(compose(p), p.name);
}

function compose({ kind, shots }) {
  const [a] = shots, w = a.width, h = a.height, g = Math.round(w * .03);
  if (kind === 'double') { // film exposed twice only ever gets lighter, which is a screen blend
    const c = canvas(w, h), x = c.getContext('2d');
    x.drawImage(a, 0, 0);
    x.globalCompositeOperation = 'screen';
    x.drawImage(shots[1], 0, 0, w, h);
    return c;
  }
  const cols = 2, rows = kind === 'half' ? 1 : 2, pad = kind === 'half' ? 0 : g;
  const c = canvas(cols * w + (cols - 1) * g + 2 * pad, rows * h + (rows - 1) * g + 2 * pad), x = c.getContext('2d');
  x.fillStyle = kind === 'half' ? '#0b0b0b' : '#f4f3ef';
  x.fillRect(0, 0, c.width, c.height);
  shots.forEach((s, i) => x.drawImage(s, pad + i % cols * (w + g), pad + Math.floor(i / cols) * (h + g), w, h));
  return c;
}

async function save(c, name) {
  const blob = await blobOf(c);
  if (blob) await keep(blob, name);
}

// Sequence fires 16 frames into a 4 x 4 grid; 3D fires its four lenses in turn and plays them back and forth as a clip.
async function burst(f) {
  setBusy(true);
  const flash = flashOn, lightsOff = flash ? await lightsOn() : null, wiggle = f.mode === 'wiggle';
  setHud('Hold still…');
  shutterSound();
  navigator.vibrate?.(12);
  const W = view.width, H = view.height, g = Math.round(W * .006), cw = (W - g * 5) / 4, ch = (H - g * 5) / 4;
  const grid = canvas(W, H), x = grid.getContext('2d'), frames = [];
  x.fillStyle = '#0b0b0b';
  x.fillRect(0, 0, W, H);
  for (let i = 0; i < (wiggle ? 4 : 16) && live; i++) {
    if (i) await wait(wiggle ? 60 : 100);
    draw(performance.now(), video, { flash: +flash, shift: wiggle ? (i - 1.5) * .012 : 0 });
    if (wiggle) frames.push(copy(view, .5));
    else x.drawImage(view, g + i % 4 * (cw + g), g + (i >> 2) * (ch + g), cw, ch);
  }
  lightsOff?.();
  roll = rollFilm();
  if (wiggle) setHud('Developing…');
  const clip = wiggle && frames.length === 4 ? await wiggleClip(frames) : null;
  showPending();
  setBusy(false);
  if (clip) await keep(clip.blob, f.name, clip.poster);
  else if (!wiggle) await save(grid, f.name);
  else if (frames[0]) await save(frames[0], f.name); // no video recording here: keep the first lens' picture
}

// Plays the four frames back and forth on a hidden canvas and records it, like a lenticular 3D print in motion.
async function wiggleClip(frames) {
  const c = canvas(frames[0].width, frames[0].height), x = c.getContext('2d');
  c.style.cssText = HIDDEN_STYLE; // some browsers only capture canvases that are in the page
  document.body.append(c);
  x.drawImage(frames[0], 0, 0);
  const poster = await blobOf(c), r = c.captureStream ? recorder(c.captureStream(30)) : null;
  if (r) for (let k = 0; k < 24; k++) {
    x.drawImage(frames[[0, 1, 2, 3, 2, 1][k % 6]], 0, 0);
    await wait(100);
  }
  const blob = await r?.stop();
  c.remove();
  return blob?.size ? { blob, poster } : null;
}

// MP4 where the browser can write it (Safari, new Chrome), WebM otherwise.
const REC_TYPES = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
function recorder(s) {
  if (!window.MediaRecorder) return null;
  const mimeType = REC_TYPES.find(t => MediaRecorder.isTypeSupported(t));
  let r;
  try { r = new MediaRecorder(s, { mimeType, videoBitsPerSecond: 8e6 }); } catch { return null; }
  const chunks = [];
  r.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise(res => { r.onstop = () => res(new Blob(chunks, { type: (r.mimeType || mimeType || 'video/webm').split(';')[0] })); });
  r.start(1000);
  return {
    stop() {
      if (r.state !== 'inactive') r.stop();
      s.getVideoTracks().forEach(t => t.stop());
      return done;
    },
  };
}

// Video cameras record what the viewfinder shows, effects and all, with the microphone when it is allowed.
let mic = null, recTick = 0;
async function startRecording() {
  if (!live || busy) return;
  const f = CAMERAS[current];
  setBusy(true);
  const lightsOff = flashOn && !mirror ? await lightsOn() : null; // the torch stays on while recording
  try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { mic = null; } // no microphone: a silent clip
  const poster = await blobOf(view);
  const s = live && view.captureStream ? view.captureStream(30) : null;
  mic?.getAudioTracks().forEach(t => s?.addTrack(t));
  const r = s && recorder(s);
  setBusy(false);
  if (!r) {
    lightsOff?.();
    mic?.getTracks().forEach(t => t.stop());
    if (live) {
      setHud('This browser can’t record video');
      setTimeout(showPending, 2500);
    }
    return;
  }
  rec = { ...r, lightsOff, poster, name: f.name };
  beep(1320);
  recUI(true);
}

async function stopRecording() {
  const r = rec;
  if (!r) return;
  rec = null;
  recUI(false);
  const blob = await r.stop();
  r.lightsOff?.();
  mic?.getTracks().forEach(t => t.stop());
  mic = null;
  beep(880);
  layout(); // the screen may have turned while recording
  matchLens(); // the zoom may have crossed lenses while recording
  if (blob.size) await keep(blob, r.name, r.poster);
}

function recUI(on) {
  shutter.classList.toggle('recording', on);
  $('rec').hidden = !on;
  for (const el of [camBtn, flip, $('settings')]) el.disabled = on;
  thumb.disabled = on || !photos.length;
  setTools();
  setShutterLabel();
  clearInterval(recTick);
  if (!on) return;
  const t0 = performance.now(), tick = () => {
    const s = Math.floor((performance.now() - t0) / 1000);
    $('recTime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  tick();
  recTick = setInterval(tick, 500);
}

// Runs a photo from the library through the current camera. A half frame or collage takes it as its next frame.
async function importPhoto(file) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.src = url;
  try { await img.decode(); } catch { return; } finally { URL.revokeObjectURL(url); }
  if (!glOk) return;
  // Full-size phone photos can be bigger than the GPU's texture limit, so scale down first.
  const k = Math.min(1, 2560 / Math.max(img.naturalWidth, img.naturalHeight));
  const src = canvas(Math.round(img.naturalWidth * k), Math.round(img.naturalHeight * k));
  src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
  const f = CAMERAS[current];
  setFormat(formatOf(f, src.width > src.height));
  draw(performance.now(), src, { mirrored: false, when: stampDate(new Date(file.lastModified || Date.now())) });
  const shot = copy(view);
  roll = rollFilm();
  layout();
  if (live) draw(performance.now());
  await take(f, shot);
}

async function keep(blob, filter, poster = null) {
  // The id is also the storage key, so two photos in the same millisecond must not share one.
  const p = addSlide({ id: Math.max(Date.now(), (photos.at(-1)?.id ?? 0) + 1), filter, blob, poster });
  photos.push(p);
  persist('readwrite', s => s.put({ id: p.id, filter, blob, poster })).catch(() => {});
  if (photos.length === 1) navigator.storage?.persist?.()?.catch(() => {});
  await flyToThumb(p.thumb);
  updateThumb();
}

// The new photo shrinks from the viewfinder into the gallery thumbnail, so you see where it went.
async function flyToThumb(url) {
  if (reduceMotion.matches) return;
  const img = new Image();
  img.src = url;
  try { await img.decode(); } catch { return; }
  const from = frameEl.getBoundingClientRect(), to = thumb.getBoundingClientRect(), m = Math.min(from.width, from.height), k = to.width / m;
  img.className = 'fly';
  Object.assign(img.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px` });
  document.body.append(img);
  await animate(img, [
    { transform: 'translate(0px, 0px) scale(1)', clipPath: 'inset(0px 0px round 12px)' },
    {
      transform: `translate(${to.left + to.width / 2 - (from.left + from.width / 2)}px, ${to.top + to.height / 2 - (from.top + from.height / 2)}px) scale(${k})`,
      clipPath: `inset(${(from.height - m) / 2}px ${(from.width - m) / 2}px round ${10 / k}px)`,
    },
  ], spring(.5)).finished.catch(() => {});
  img.remove();
}

// ---------------------------------------------------------------------------
// Photos and clips: kept in IndexedDB so closing the tab doesn't lose them
// ---------------------------------------------------------------------------
const photos = [];
const dbReady = new Promise((resolve, reject) => {
  const r = indexedDB.open('retro-camera', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
  r.onsuccess = () => resolve(r.result);
  r.onerror = () => reject(r.error);
});
// Runs one request in its own transaction and resolves once it is committed.
async function persist(mode, fn) {
  const tx = (await dbReady).transaction('photos', mode), req = fn(tx.objectStore('photos'));
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve(req.result);
    tx.onerror = tx.onabort = () => reject(tx.error);
  });
}

const fmtDate = id => new Date(id).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const isClip = p => p.blob.type.startsWith('video/');

function addSlide(p) {
  p.url = URL.createObjectURL(p.blob);
  p.thumb = p.poster ? URL.createObjectURL(p.poster) : p.url;
  const slide = document.createElement('div');
  let media;
  if (isClip(p)) {
    media = document.createElement('video');
    Object.assign(media, { src: p.url, poster: p.thumb, loop: true, muted: true, playsInline: true, controls: true, preload: 'metadata' });
    media.setAttribute('playsinline', '');
    media.setAttribute('aria-label', `${p.filter} video, ${fmtDate(p.id)}`);
  } else {
    media = new Image();
    media.src = p.url;
    media.alt = `${p.filter} photo, ${fmtDate(p.id)}`;
    media.draggable = false;
  }
  slide.className = 'slide';
  slide.append(media);
  pager.append(slide);
  slideObserver.observe(slide);
  p.slide = slide;
  return p;
}

function updateThumb() {
  const last = photos.at(-1), img = thumb.firstElementChild;
  thumb.disabled = !last || !!rec;
  if (last) img.src = last.thumb;
  else img.removeAttribute('src');
  thumb.setAttribute('aria-label', last ? `Open photos, ${photos.length} total` : 'No photos yet');
}

async function loadPhotos() {
  try {
    (await persist('readonly', s => s.getAll())).forEach(p => photos.push(addSlide(p)));
    photos.sort((a, b) => a.id - b.id);
    pager.append(...photos.map(p => p.slide));
    updateThumb();
  } catch {} // no storage (some private modes): photos just last for this visit
}

// ---------------------------------------------------------------------------
// Gallery
// ---------------------------------------------------------------------------
let index = -1, closing = false, drag = null, deleteTimer = 0;
const FULL_CLIP = 'inset(0px 0px 0px 0px round 0px)';

// The clip on screen plays, muted, on a loop; the others wait.
const slideObserver = new IntersectionObserver(entries => {
  for (const e of entries) {
    const clip = e.target.querySelector('video');
    if (clip) e.isIntersecting && !viewer.hidden ? clip.play().catch(() => {}) : clip.pause();
    if (!e.isIntersecting) continue;
    index = photos.findIndex(p => p.slide === e.target);
    updateCaption();
  }
}, { root: pager, threshold: .6 });

function updateCaption() {
  const p = photos[index];
  if (!p) return;
  $('capTitle').textContent = p.filter;
  $('capSub').textContent = isClip(p) ? `${fmtDate(p.id)} · Video` : fmtDate(p.id);
  del.setAttribute('aria-label', isClip(p) ? 'Delete video' : 'Delete photo');
  resetDelete();
}

// Transform and clip that make a resting photo cover the gallery thumbnail exactly.
function atThumb(img) {
  const t = thumb.getBoundingClientRect(), s = img.parentElement.getBoundingClientRect();
  const w = img.offsetWidth, h = img.offsetHeight, m = Math.min(w, h), k = t.width / m;
  const x = t.left + t.width / 2 - (s.left + img.offsetLeft + w / 2), y = t.top + t.height / 2 - (s.top + img.offsetTop + h / 2);
  return { x, y, frame: { transform: `translate(${x}px, ${y}px) scale(${k})`, clipPath: `inset(${(h - m) / 2}px ${(w - m) / 2}px round ${10 / k}px)` } };
}

function openViewer() {
  if (!photos.length) return;
  viewer.hidden = false;
  app.inert = true;
  pager.scrollLeft = pager.scrollWidth;
  index = photos.length - 1;
  updateCaption();
  const media = photos[index].slide.firstElementChild;
  if (media.tagName === 'VIDEO') media.play().catch(() => {});
  const fade = [{ opacity: 0 }, { opacity: 1 }];
  if (reduceMotion.matches) animate(viewer, fade, { duration: 200 });
  else {
    animate(media, [atThumb(media).frame, { transform: 'translate(0px, 0px) scale(1)', clipPath: FULL_CLIP }], spring(.42));
    [viewerBg, ...bars].forEach(el => animate(el, fade, { duration: 260, easing: 'ease-out' }));
  }
  $('close').focus({ preventScroll: true });
}

// Closes back into the thumbnail. `at` is where a drag left the photo; `v` is the finger's speed in px/s.
async function closeViewer(v = 0, at = { y: 0, s: 1 }) {
  if (closing || viewer.hidden) return;
  closing = true;
  const img = photos[index]?.slide.firstElementChild;
  let anims;
  if (reduceMotion.matches || !img) anims = [animate(viewer, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 })];
  else {
    const target = atThumb(img), rel = clamp(v / Math.max(Math.hypot(target.x, target.y - at.y), 1), 0, 20);
    anims = [
      animate(img, [{ transform: `translate(0px, ${at.y}px) scale(${at.s})`, clipPath: FULL_CLIP }, target.frame], spring(.42, rel)),
      ...[viewerBg, ...bars].map(el => animate(el, [{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 220, easing: 'ease-out' })),
    ];
  }
  await Promise.all(anims.map(a => a.finished.catch(() => {})));
  viewer.hidden = true;
  pager.querySelectorAll('video').forEach(c => c.pause());
  for (const el of [viewer, viewerBg, ...bars, img]) el?.removeAttribute('style');
  app.inert = false;
  closing = false;
  resetDelete();
  thumb.focus({ preventScroll: true });
}

// Swipe a photo down to dismiss: it tracks the finger 1:1, then hands its speed to the spring.
function follow(img, y) {
  const p = clamp(y / innerHeight, 0, 1), s = 1 - p * .4, o = String(1 - clamp(p * 2.5, 0, 1));
  img.style.transform = `translate(0px, ${y}px) scale(${s})`;
  viewerBg.style.opacity = o;
  bars.forEach(b => { b.style.opacity = o; });
  return { y, s };
}

pager.addEventListener('pointerdown', e => {
  const img = photos[index]?.slide.firstElementChild;
  if (!img || closing) return;
  let y = 0;
  if (img.getAnimations().length) { // grabbed mid-flight: carry on from where it is on screen
    const t = getComputedStyle(img).transform;
    y = t === 'none' ? 0 : new DOMMatrix(t).f;
    [img, viewerBg, ...bars].forEach(el => el.getAnimations().forEach(a => a.cancel()));
    follow(img, y);
  }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, img, from: y, at: { y, s: 1 }, on: y !== 0, hist: [] };
  if (drag.on) pager.setPointerCapture(e.pointerId);
});

pager.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dy) < 10 || Math.abs(dy) < Math.abs(dx)) return;
    drag.on = true;
    drag.y = e.clientY; // track from here so the photo doesn't jump by the threshold
    pager.setPointerCapture(e.pointerId);
  }
  const raw = drag.from + e.clientY - drag.y;
  drag.at = follow(drag.img, raw >= 0 ? raw : -rubberband(-raw, innerHeight));
  drag.hist.push([e.timeStamp, e.clientY]);
  if (drag.hist.length > 5) drag.hist.shift();
});

function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (!d.on) return;
  const a = d.hist[0], b = d.hist.at(-1);
  // A finger that stopped before lifting has no velocity left to hand over.
  const v = a && b[0] > a[0] && e.timeStamp - b[0] < 80 ? (b[1] - a[1]) / (b[0] - a[0]) * 1000 : 0;
  // Decide from where the flick is heading, not only where the finger let go.
  if (d.at.y + project(v) > innerHeight * .15) return closeViewer(Math.max(v, 0), d.at);
  const back = spring(.38, d.at.y ? clamp(-v / d.at.y, 0, 20) : 0);
  animate(d.img, [{ transform: d.img.style.transform }, { transform: 'translate(0px, 0px) scale(1)' }], back);
  [viewerBg, ...bars].forEach(el => animate(el, [{ opacity: el.style.opacity || 1 }, { opacity: 1 }], back));
}
pager.addEventListener('pointerup', release);
pager.addEventListener('pointercancel', release);

viewer.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  photos[clamp(index + step, 0, photos.length - 1)]?.slide.scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduceMotion.matches ? 'auto' : 'smooth' });
});

$('share').onclick = async () => {
  const p = photos[index];
  if (!p) return;
  const type = p.blob.type || 'image/jpeg', ext = type.includes('mp4') ? 'mp4' : type.includes('webm') ? 'webm' : 'jpg';
  const file = new File([p.blob], `retro-${p.filter.replace(/\W+/g, '').toLowerCase()}-${p.id}.${ext}`, { type });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {} // closing the share sheet rejects; nothing to do
  } else {
    Object.assign(document.createElement('a'), { href: p.url, download: file.name }).click();
  }
};

// Delete asks twice inline: the first tap turns the button red, the second deletes.
function resetDelete() {
  clearTimeout(deleteTimer);
  del.classList.remove('confirm');
}
del.onclick = () => {
  if (!del.classList.contains('confirm')) {
    del.classList.add('confirm');
    del.setAttribute('aria-label', 'Tap again to delete');
    deleteTimer = setTimeout(() => { resetDelete(); updateCaption(); }, 3000);
    return;
  }
  resetDelete();
  const [p] = photos.splice(index, 1);
  if (!p) return;
  persist('readwrite', s => s.delete(p.id)).catch(() => {});
  slideObserver.unobserve(p.slide);
  p.slide.remove();
  URL.revokeObjectURL(p.url);
  if (p.thumb !== p.url) URL.revokeObjectURL(p.thumb);
  updateThumb();
  if (!photos.length) return closeViewer();
  index = clamp(index, 0, photos.length - 1);
  updateCaption();
};

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
shutter.onclick = shoot;
flip.onclick = switchCamera;
camBtn.onclick = () => {
  syncCams();
  openSheet(camSheet, camBtn);
  camButtons[current].scrollIntoView({ block: 'center' });
};
$('edit').onclick = () => { editing = !editing; syncCams(); };
$('settings').onclick = () => openSheet(setSheet, $('settings'));
$('setDone').onclick = () => closeSheet(setSheet);
$('hud').onclick = () => { pending = null; showPending(); };
$('flash').onclick = () => { flashOn = !flashOn; setTools(); };
$('timer').onclick = () => { timer = TIMERS[(TIMERS.indexOf(timer) + 1) % TIMERS.length]; setTools(); };
$('double').onclick = () => {
  doubleOn = !doubleOn;
  if (!doubleOn && pending?.kind === 'double') { pending = null; showPending(); }
  setTools();
};
$('date').onclick = () => {
  S.date = S.date === 'off' ? S.lastDate || 'today' : 'off';
  saveSettings();
  applySettings();
};
for (const [k, pill] of Object.entries(QUICK)) pill.onclick = () => showPanel(openPanel === k ? null : k);
$('evRange').oninput = e => { ev = +e.target.value; syncDials(); };
$('evReset').onclick = $('evAuto').onclick = () => { ev = 0; syncDials(); };
$('wbRange').oninput = e => { wbK = +e.target.value; syncDials(); };
$('wbAuto').onclick = () => { wbK = 0; syncDials(); };
$('wbSun').onclick = () => { wbK = 5500; syncDials(); };
$('wbBulb').onclick = () => { wbK = 3200; syncDials(); };
for (const b of focalButtons) b.onclick = () => setFocal(+b.dataset.mm);
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = ''; // so choosing the same photo again still fires
  for (const file of files) await importPhoto(file);
};
thumb.onclick = openViewer;
$('close').onclick = () => closeViewer();
$('retry').onclick = start;
document.addEventListener('touchstart', () => {}, { passive: true }); // lets iOS show :active press states
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
view.addEventListener('webglcontextlost', e => { e.preventDefault(); glOk = false; });
view.addEventListener('webglcontextrestored', () => { try { initGL(); } catch (e) { console.error(e); } });
new ResizeObserver(layout).observe(finder);

try { if (gl) initGL(); } catch (e) { console.error(e); }
applySettings();
setFilm(current);
syncDials();
loadPhotos();
start();
requestAnimationFrame(frame);

// self-check
console.assert(stampText(new Date(2026, 0, 5)) === "'26 _1 _5", 'date stamp text');
console.assert(Math.abs(spring(.4).duration - 590) < 30, 'spring settles in about 0.6s');
console.assert(cropFor(1, 200, 100, false).join() === '0.25,0,0.5,1' && cropFor(1, 200, 100, true).join() === '0.75,0,-0.5,1', 'cover crop');
console.assert(cropFor(1, 100, 100, false, 2).join() === '0.25,0.25,0.5,0.5' && cropFor(.5, 200, 100, false, 1, 1).join() === '0.75,0,0.25,1', 'zoom and shift stay inside the source');
console.assert(new Set(CAMERAS.map(f => f.name)).size === CAMERAS.length, 'camera names are unique');
console.assert(CAMERAS.every(f => ART[f.name] && f.about && GROUPS.some(([g]) => g === f.group)), 'every camera has a drawing, a description and a drawer section');
console.assert(LENSES.every(([id]) => LENS_ART[id]), 'every lens has a drawing');
console.assert(kelvinWb(5500).every(v => Math.abs(v - 1) < 1e-9) && kelvinWb(3200)[2] > 1 && kelvinWb(9000)[0] > 1, 'kelvin: 5500K is neutral, lower is bluer, higher is warmer');
console.assert(CAMERAS.every(f => [false, true].every(l => {
  const { win: [x, y, w, h] } = formatOf(f, l);
  return x >= 0 && y >= 0 && x + w <= 1 + 1e-9 && y + h <= 1 + 1e-9;
})), 'every picture sits inside its canvas');
const gate = formatOf({ frame: 'gate', mode: 'half', ratio: 3 / 4 }, false);
console.assert(Math.abs(gate.win[0] * gate.aspect - gate.win[1]) < 1e-9 && Math.abs(gate.win[2] * gate.aspect / gate.win[3] - .75) < 1e-9, 'film gate: even border, picture keeps its ratio');
console.assert(S.date !== 'custom' || !S.custom || stampDate(new Date(2020, 5, 1, 9, 30)).getHours() === 9, 'custom date keeps the time of day');
</script>
