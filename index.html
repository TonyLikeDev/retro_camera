<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Retro Camera</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0c;
    --surface: #1c1c1e;
    --text: #f5f5f7;
    --text-2: rgba(235, 235, 245, .6);
    --hairline: rgba(255, 255, 255, .14);
    --fill: rgba(255, 255, 255, .12);
    --fill-pressed: rgba(255, 255, 255, .24);
    --glass: rgba(0, 0, 0, .5);
    --accent: #f5b53f;
    --danger: #ff453a;
    --radius: 12px;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  svg { display: block; width: 24px; height: 24px; }
  [hidden] { display: none !important; }

  /* Camera: tools, viewfinder, camera name, controls */
  .app {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .tools { display: flex; align-items: center; gap: 2px; padding-bottom: 8px; }
  .tool {
    height: 44px; min-width: 44px; padding: 0 8px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .2s, transform .2s var(--ease-out), opacity .2s;
  }
  .tool:active:not(:disabled) { background: var(--fill); transform: scale(.94); transition-duration: .05s; }
  .tool:disabled { opacity: .3; }
  .tool svg { width: 22px; height: 22px; }
  .tool[aria-pressed="true"], .tool.set { color: var(--accent); }
  .tool[aria-pressed="true"] .off, .tool[aria-pressed="false"] .on { display: none; }
  .tool span { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tool span:empty { display: none; }
  #import { margin-left: auto; }

  .finder { position: relative; min-height: 0; display: grid; place-items: center; touch-action: none; }
  .count {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: 112px; font-weight: 200; font-variant-numeric: tabular-nums; text-shadow: 0 2px 24px rgba(0, 0, 0, .45);
  }
  .count:empty { display: none; }
  .screen-flash { position: fixed; inset: 0; z-index: 30; background: #fff; pointer-events: none; }
  .frame { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  #view { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .5s var(--ease-out), filter .3s var(--ease-out); }
  #view.live { opacity: 1; }
  #view.switching { filter: blur(18px) brightness(.75); }
  .ghost { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .45; mix-blend-mode: screen; pointer-events: none; }
  .grid-lines {
    --l: rgba(255, 255, 255, .3);
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, transparent calc(100% / 3 - .5px), var(--l) 0 calc(100% / 3 + .5px), transparent 0 calc(200% / 3 - .5px), var(--l) 0 calc(200% / 3 + .5px), transparent 0),
      linear-gradient(transparent calc(100% / 3 - .5px), var(--l) 0 calc(100% / 3 + .5px), transparent 0 calc(200% / 3 - .5px), var(--l) 0 calc(200% / 3 + .5px), transparent 0);
  }

  /* Over the viewfinder: shot progress and recording time on top, quick dials on the right */
  .hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .pill-hud {
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill-hud svg { width: 14px; height: 14px; }
  .pill-hud:disabled svg { display: none; }
  .rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* Quick settings, as in Dazz: buttons along the bottom of the viewfinder each open a panel above the shutter */
  .quick { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; }
  .q {
    position: relative; height: 36px; min-width: 36px; padding: 0 9px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(28, 28, 30, .62); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
    transition: transform .2s var(--ease-out), background .2s;
  }
  .q::before { content: ""; position: absolute; inset: -4px; } /* a 44px touch target */
  .q:active { transform: scale(.92); transition-duration: .05s; }
  .q svg { width: 18px; height: 18px; }
  .q small { align-self: flex-end; margin: 0 5px 8px -3px; font-size: 8px; font-weight: 800; }
  .q > :last-child:not(.caret) { margin-left: 2px; }
  .q.set > svg:not(.caret) { color: var(--accent); }
  .q .caret, .q.open > :not(.caret) { display: none; }
  .q.open { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .q.open .caret { display: block; width: 20px; height: 20px; }

  .tray { display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; height: 88px; min-width: 0; } /* one column the panels can't widen */
  .tray > * { grid-area: 1 / 1; }
  .qpanel { display: flex; align-items: center; justify-content: center; gap: 10px; width: min(100%, 380px); animation: rise .3s var(--ease-out); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .qbtn {
    flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-content: center; justify-items: center;
    background: var(--fill); font-size: 17px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;
    transition: background .2s, color .2s, transform .2s var(--ease-out);
  }
  .qbtn:active { transform: scale(.92); transition-duration: .05s; }
  .qbtn svg { width: 20px; height: 20px; }
  .qbtn small { margin-top: 2px; font-size: 9px; font-weight: 700; }
  .qbtn[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .lensbtn { width: 50px; height: 50px; }
  .qslider { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .qslider output { justify-self: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .range { -webkit-appearance: none; appearance: none; display: block; width: 100%; margin: 0; border-radius: 10px; cursor: pointer; }
  .range::-webkit-slider-runnable-track { height: 100%; background: none; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: border-box; }
  .range::-moz-range-track { background: none; }
  .range:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #wbRange {
    height: 44px;
    background:
      radial-gradient(circle, rgba(255, 255, 255, .75) 1px, transparent 1.5px) center / 6px 4px repeat-x,
      linear-gradient(90deg, #5b6bff, #ff9a4d);
  }
  #wbRange::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: 10px; border-radius: 50%; background: #111; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
  #wbRange::-moz-range-thumb { box-sizing: border-box; width: 24px; height: 24px; border-radius: 50%; background: #111; border: 3px solid #fff; }
  #evRange { height: 34px; background: var(--fill); }
  #evRange::-webkit-slider-thumb { width: 12px; height: 28px; margin-top: 3px; border-radius: 6px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
  #evRange::-moz-range-thumb { box-sizing: border-box; width: 12px; height: 28px; border: 0; border-radius: 6px; background: #fff; }

  .status { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 32px; text-align: center; }
  .status svg { width: 40px; height: 40px; margin-bottom: 8px; color: var(--text-2); }
  .status-title { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .status-body { margin: 0; max-width: 30ch; color: var(--text-2); text-wrap: balance; }
  .pill { margin-top: 12px; padding: 11px 22px; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; transition: transform .2s var(--ease-out); }
  .pill:active { transform: scale(.96); transition-duration: .05s; }

  .cam-name { margin: 0; padding: 12px 0 2px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 16px 0; }
  .thumb {
    justify-self: start; width: 48px; height: 48px; overflow: hidden;
    border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface);
    transition: transform .2s var(--ease-out);
  }
  .thumb:active:not(:disabled) { transform: scale(.92); transition-duration: .05s; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb img:not([src]) { display: none; }
  .shutter { width: 78px; height: 78px; padding: 4px; border-radius: 50%; border: 4px solid var(--text); transition: opacity .2s; }
  .shutter::after { content: ""; display: block; height: 100%; border-radius: 35px; background: var(--text); transition: transform .25s var(--ease-out), border-radius .25s var(--ease-out), background .2s; }
  .shutter:active:not(:disabled)::after { transform: scale(.86); transition-duration: .05s; }
  .shutter.video::after { background: var(--danger); }
  .shutter.counting::after, .shutter.recording::after { transform: scale(.42); border-radius: 12px; } /* a stop square */
  .shutter:disabled { opacity: .35; }
  .cam-btn {
    justify-self: end; width: 64px; height: 52px; display: grid; place-items: center; border-radius: 14px;
    background: var(--fill); transition: background .2s, transform .2s var(--ease-out), opacity .2s;
  }
  .cam-btn:active:not(:disabled) { background: var(--fill-pressed); transform: scale(.94); transition-duration: .05s; }
  .cam-btn:disabled { opacity: .35; }
  .cam-btn svg { width: 54px; height: 40px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .55)); }
  .round {
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--fill); transition: background .2s, transform .2s var(--ease-out);
  }
  .round:active { background: var(--fill-pressed); transform: scale(.94); transition-duration: .05s; }

  /* Phones held sideways: viewfinder left, everything else right */
  @media (orientation: landscape) and (max-height: 540px) {
    .app { grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto auto 1fr; column-gap: 12px; }
    .finder { grid-area: 1 / 1 / -1 / 2; }
    .tools { grid-area: 1 / 2; gap: 0; }
    .tool { min-width: 40px; padding: 0 6px; }
    .tray { grid-area: 3 / 2; }
    .controls { grid-area: 4 / 2; }
  }

  .fly { position: fixed; z-index: 5; pointer-events: none; object-fit: cover; will-change: transform; }

  /* Sheets: the camera drawer and settings slide up from the bottom */
  .sheet { position: fixed; inset: 0; z-index: 15; }
  .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; max-height: 84dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    background: rgba(30, 30, 32, .9); -webkit-backdrop-filter: blur(30px) saturate(160%); backdrop-filter: blur(30px) saturate(160%);
    border-radius: 22px 22px 0 0; border-top: 1px solid rgba(255, 255, 255, .1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 4px; touch-action: none; cursor: grab; }
  .grab { position: absolute; top: 7px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: rgba(255, 255, 255, .28); }
  .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .text-btn { height: 44px; padding: 0 4px; color: var(--accent); font-weight: 600; }
  .about { margin: 0; padding: 0 20px 8px; min-height: 2.9em; color: var(--text-2); font-size: 13px; line-height: 1.45; }
  .about strong { color: var(--text); font-weight: 600; }
  .cam-list {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 10px 12px;
    -webkit-mask-image: linear-gradient(transparent, #000 14px, #000 calc(100% - 14px), transparent);
            mask-image: linear-gradient(transparent, #000 14px, #000 calc(100% - 14px), transparent);
  }
  .cam-group h3, .lenses h3 { margin: 12px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
  .cam-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .cam {
    position: relative; min-width: 0; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; border-radius: 12px;
    transition: background .2s, transform .2s var(--ease-out), opacity .2s;
  }
  .cam:active { background: var(--fill); transform: scale(.94); transition-duration: .05s; }
  .cam svg { width: 64px; height: 48px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
  .cam span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--text-2); }
  .cam[aria-current="true"] { background: var(--fill); }
  .cam[aria-current="true"] span { color: var(--accent); }
  .cam .badge { position: absolute; top: 6px; right: 8px; width: 16px; height: 16px; display: none; color: var(--text); }
  .editing .cam.off { opacity: .35; }
  .editing .cam.off .badge { display: block; }
  .lenses { border-top: 1px solid var(--hairline); padding: 0 10px 10px; }
  .lens-row { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .lens-row::-webkit-scrollbar { display: none; }
  .lens { flex: 1 0 58px; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; transition: background .2s, transform .2s var(--ease-out), opacity .2s; }
  .lens:active:not(:disabled) { transform: scale(.94); transition-duration: .05s; }
  .lens:disabled { opacity: .3; }
  .lens svg { width: 48px; height: 36px; }
  .lens span { font-size: 11px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
  .lens[aria-checked="true"] { background: var(--fill); }
  .lens[aria-checked="true"] span { color: var(--accent); }

  .rows { overflow-y: auto; padding: 4px 20px 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--hairline); }
  .seg { display: flex; padding: 2px; border-radius: 9px; background: var(--fill); }
  .seg button { height: 32px; padding: 0 9px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text-2); transition: background .2s, color .2s; }
  .seg button[aria-checked="true"] { background: rgba(255, 255, 255, .22); color: var(--text); }
  .switch {
    appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 51px; height: 31px; margin: 0;
    border-radius: 16px; background: var(--fill); cursor: pointer; transition: background .25s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: transform .3s var(--ease-out);
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(20px); }
  .switch:focus-visible, input[type="date"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="date"] { font: inherit; color: var(--text); background: var(--fill); border: 0; border-radius: 8px; padding: 6px 10px; color-scheme: dark; }
  .note { margin: 0; padding: 12px 20px 16px; font-size: 13px; color: var(--text-2); }

  /* Gallery */
  .viewer { position: fixed; inset: 0; z-index: 10; }
  .viewer-bg { position: absolute; inset: 0; background: var(--bg); }
  .pager {
    position: absolute; inset: 0; display: flex;
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    overscroll-behavior: contain; touch-action: pan-x;
  }
  .pager::-webkit-scrollbar { display: none; }
  .slide {
    position: relative; flex: 0 0 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 64px) 0 calc(env(safe-area-inset-bottom) + 84px);
    scroll-snap-align: center; scroll-snap-stop: always;
  }
  .slide img, .slide video { display: block; max-width: 100%; max-height: 100%; -webkit-user-drag: none; }
  .bar { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .bar.top { top: 0; padding-top: max(12px, env(safe-area-inset-top)); }
  .bar.bottom { bottom: 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .bar svg { width: 22px; height: 22px; }
  .caption { display: grid; min-width: 0; text-align: center; }
  .caption strong { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .caption span { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .spacer { width: 48px; }
  .delete { width: auto; min-width: 48px; padding: 0 13px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; }
  .delete span { display: none; font-weight: 600; }
  .delete.confirm { background: var(--danger); padding: 0 18px 0 16px; }
  .delete.confirm span { display: inline; }

  @media (prefers-reduced-transparency: reduce) {
    .panel { background: #1e1e20; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .q, .pill-hud { background: rgba(0, 0, 0, .8); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { transition-duration: .01ms !important; }
    .rec i, .qpanel { animation: none; }
  }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs><!-- shared by the camera and lens drawings -->
    <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7f93c4"/><stop offset=".35" stop-color="#26305a"/><stop offset="1" stop-color="#05060b"/></radialGradient>
    <radialGradient id="ruby" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8f80"/><stop offset=".4" stop-color="#9c1f1a"/><stop offset="1" stop-color="#2a0505"/></radialGradient>
    <radialGradient id="smoke" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8d8d93"/><stop offset=".45" stop-color="#3a3a3e"/><stop offset="1" stop-color="#0c0c0e"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f2f2"/><stop offset=".55" stop-color="#a9a9ad"/><stop offset="1" stop-color="#dcdcdf"/></linearGradient>
  </defs>
</svg>
<main class="app" id="app">
  <div class="tools">
